vars:
  time_limit: &time_limit 86400 # 3600 * 24 hours
  step_count: &step_count 2000 # empirically, 500 steps in ~6 hours → 2000 for 24h
  data_recursion_limit: &data_recursion_limit 512
  experiment_recursion_limit: &experiment_recursion_limit 512

# Single agent entry. Model assignments are NOT selected via kwargs anymore —
# edit ``bench_workflows/model_configs/mlebench_roles.yaml`` in the SciDER
# source tree to swap models. This matches the airsbench / astrovisbench
# refactor and removes the combinatorial explosion of preset-named entries.
scider:
  start: scider/start.sh
  dockerfile: scider/Dockerfile
  kwargs_type: argparse
  kwargs: # args for bench_workflows.mlebench_workflow
    data-recursion-limit: *data_recursion_limit
    experiment-recursion-limit: *experiment_recursion_limit
  env_vars:
    TIME_LIMIT_SECS: *time_limit
    STEP_LIMIT: *step_count
